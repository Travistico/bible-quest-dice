<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bible Quest Dice — Test Build</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B2%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
  :root {
    --bg-top: #f7c948;
    --bg-bottom: #ee9f3d;
    --paper: #fffaf0;
    --card: #ffffff;
    --card-border: #f0e2c8;
    --ink: #3a2c1a;
    --ink-soft: #83725a;
    --brown: #a5551f;
    --brown-dark: #7a3c14;
    --gold: #e0a527;
    --claim: #eafaf0;
    --claim-border: #4caf7d;
    --accent: #e0562f;
    --accent-dark: #c8431f;
    --danger: #d1453b;
    --shadow-sm: 0 2px 0 rgba(0,0,0,0.08);
    --shadow-md: 0 6px 16px rgba(90,50,10,0.18);
    --shadow-lg: 0 12px 30px rgba(90,50,10,0.22);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    margin: 0;
    font-family: 'Nunito', 'Segoe UI', sans-serif;
    background: linear-gradient(160deg, var(--bg-top), var(--bg-bottom));
    background-attachment: fixed;
    color: var(--ink);
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 2px 20px;
    text-align: center;
    flex-shrink: 0;
  }
  header h1 {
    margin: 0;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 1em;
    letter-spacing: 0.5px;
    color: #3a2408;
    text-shadow: 1px 2px 0 rgba(255,255,255,0.35);
    display: inline;
  }
  header p { margin: 0 0 0 8px; font-size: 0.65em; font-weight: 700; color: #5c3d10; opacity: 0.85; display: inline; }
  header .ref-link { margin: 0 0 0 10px; font-size: 0.65em; font-weight: 700; color: #5c3d10; opacity: 0.85; display: inline; text-decoration: underline; }
  header .ref-link:hover { opacity: 1; }

  .wrap {
    max-width: 2000px;
    width: 100%;
    margin: 0 auto;
    padding: 6px 12px;
    background: var(--paper);
    border-radius: 28px;
    box-shadow: var(--shadow-lg);
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: row;
    gap: 10px;
    overflow: hidden;
  }

  .sidebar {
    flex: 0 0 500px;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .panel {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    padding: 8px 12px;
    margin: 0 0 6px;
    box-shadow: var(--shadow-sm);
    flex-shrink: 0;
  }
  .panel.pool-panel {
    flex: 1;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    margin-bottom: 0;
    overflow: hidden;
    padding: 6px 8px;
  }
  .sidebar .panel.mode-banner {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
  }

  .controls-col {
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: stretch;
  }
  .controls-col .dice-amount-label { text-align: center; }
  #rollBtn { width: 100%; }

  .dice-amount-label { font-size: 0.9em; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink-soft); }
  .dice-amount-label #diceAmountValue { color: var(--brown-dark); }
  .slider-row { display: flex; align-items: center; justify-content: center; padding: 6px 4px 2px; }
  #diceAmountSlider {
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    height: 8px;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--brown), var(--gold));
    outline: none;
    cursor: pointer;
  }
  #diceAmountSlider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: #fffefb;
    border: 3px solid var(--brown-dark);
    box-shadow: var(--shadow-sm);
    cursor: pointer;
  }
  #diceAmountSlider::-moz-range-thumb {
    width: 26px; height: 26px;
    border-radius: 50%;
    background: #fffefb;
    border: 3px solid var(--brown-dark);
    box-shadow: var(--shadow-sm);
    cursor: pointer;
  }
  #diceAmountSlider::-moz-range-track {
    height: 8px;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--brown), var(--gold));
  }

  button {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    cursor: pointer;
    border: none;
    background: var(--brown);
    color: #fff;
    border-radius: 999px;
    padding: 10px 18px;
    font-size: 0.88em;
    box-shadow: var(--shadow-sm);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  button:hover { filter: brightness(1.08); }
  button:active { transform: translateY(2px); box-shadow: none; }
  button.secondary { background: #fff; color: var(--brown); border: 2px solid var(--card-border); box-shadow: none; }
  button.secondary:hover { background: #fdf3e2; }
  button.small { padding: 5px 12px; font-size: 0.75em; }
  button.danger { background: var(--danger); }
  button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  #rollBtn {
    font-size: 1.15em;
    padding: 13px 30px;
    background: var(--accent);
    box-shadow: 0 4px 0 var(--accent-dark);
  }
  #rollBtn:active { box-shadow: 0 1px 0 var(--accent-dark); }

  .mode-banner {
    color: #fff;
    border: none;
    box-shadow: var(--shadow-md);
    padding: 16px 20px;
  }
  .mode-banner .mode-image {
    width: 100%;
    aspect-ratio: 16 / 10;
    line-height: 0;
    border-radius: 12px;
    overflow: hidden;
    margin: 0 0 4px;
    background: #2a1c0d;
    box-shadow: 0 2px 8px rgba(0,0,0,0.28), inset 0 0 0 1px rgba(255,255,255,0.15);
  }
  .mode-banner .mode-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 20%;
    display: block;
    filter: sepia(0.35) saturate(1.15) contrast(1.05) brightness(1.02);
  }
  .mode-banner .image-ref { font-size: 0.68em; font-weight: 700; opacity: 0.85; margin: 0 0 2px; }
  .mode-banner .image-credit { font-size: 0.62em; font-weight: 600; opacity: 0.65; margin: 0 0 10px; font-style: italic; }
  .mode-head { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
  .mode-glyph {
    flex-shrink: 0;
    width: 48px; height: 48px;
    border-radius: 50%;
    background: rgba(255,255,255,0.22);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5em;
    font-family: 'Baloo 2', sans-serif;
  }
  .mode-banner h2 { margin: 0; font-family: 'Baloo 2', sans-serif; font-size: 1.4em; letter-spacing: 0.5px; }
  .mode-banner .goal { font-weight: 700; opacity: 0.92; margin: 2px 0 0; font-size: 0.9em; display: block; }
  .mode-banner .mode-steps { margin: 0 0 10px; font-size: 0.92em; font-weight: 600; line-height: 1.5; }
  .mode-banner .mode-actions { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  .mode-banner .mode-actions button.secondary { background: rgba(255,255,255,0.15); color: #fff; border-color: rgba(255,255,255,0.5); }
  .mode-banner .mode-actions button.secondary:hover { background: rgba(255,255,255,0.28); }
  .mode-banner .mode-actions .hint-text { font-size: 0.8em; opacity: 0.85; font-weight: 600; }

  .pool-grid {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-auto-rows: 1fr;
    gap: 4px 4px;
    align-content: stretch;
  }
  /* With very few dice, a single stretched row of 4 narrow-but-tall columns
     forces each die's fixed-size 3D mesh past its own camera frustum and it
     gets clipped left/right. Corner them into a 2x2 grid instead so cells
     stay close to square and every die has room to render at full size. */
  .pool-grid.grid-corners {
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: repeat(2, 1fr);
  }
  .die-card {
    border: none;
    background: transparent;
    padding: 1px 1px;
    text-align: center;
    position: relative;
    cursor: pointer;
    user-select: none;
    transition: transform 0.15s ease;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .die-card:hover { transform: translateY(-3px); }
  .die-card:active { transform: translateY(-1px); }

  .cube-slot {
    width: 100%;
    flex: 1;
    min-height: 0;
    position: relative;
    border-radius: 16px;
    overflow: visible;
    transition: box-shadow 0.15s ease;
  }
  .cube-slot canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; object-fit: contain; }
  @keyframes face2DIn { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
  .cube-slot canvas.face-2d { animation: face2DIn 0.2s ease; }

  .die-card .die-cat {
    flex-shrink: 0;
    font-size: 0.6em;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--ink-soft);
    margin-top: 2px;
    line-height: 1.2;
    display: -webkit-box;
    -webkit-line-clamp: 1;
    line-clamp: 1;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .die-card.selected .cube-slot {
    box-shadow: 0 0 0 3px var(--claim-border), 0 0 16px rgba(76,175,125,0.45);
  }
  .die-card.holding .cube-slot {
    animation: holdCharge 0.55s linear forwards;
  }
  @keyframes holdCharge {
    from { box-shadow: 0 0 0 0 rgba(224,165,39,0); }
    to { box-shadow: 0 0 0 8px rgba(224,165,39,0.65); }
  }
  .die-card.rule-die { cursor: default; }
  .die-card.rule-die:hover { transform: none; }
  .die-card.rule-die .die-cat { color: #3a2c1a; font-weight: 800; }
  .die-card.selected::after {
    content: "✓";
    position: absolute; top: -6px; right: -2px;
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--claim-border); color: #fff;
    font-size: 0.7em; font-weight: 900;
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow-sm);
    z-index: 3; /* above #sharedDiceCanvas (z-index:1) so it isn't ever painted over */
  }
  /* Double-click a die to lock it — it survives the next Roll instead of
     being replaced. Double-click again to release it. */
  .die-card.locked .cube-slot {
    box-shadow: 0 0 0 3px var(--gold), 0 0 16px rgba(224,165,39,0.5);
  }
  .die-card.locked::before {
    content: "🔒";
    position: absolute; top: -6px; left: -2px;
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--gold); color: #fff;
    font-size: 0.6em;
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow-sm);
    z-index: 3;
  }
  /* One WebGL canvas, shared by every die (see the module script) — each
     die is drawn into its own on-screen rectangle within it via
     setScissor/setViewport every frame, instead of each die owning a
     separate WebGLRenderer/context. Click-through via pointer-events so all
     the real interaction stays on the actual .die-card elements beneath it. */
  #sharedDiceCanvas {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    pointer-events: none;
    z-index: 1;
  }
  .die-card .die-tools {
    position: absolute;
    top: 2px; right: 2px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.12s ease;
    z-index: 2;
  }
  .die-card:hover .die-tools,
  .die-card:focus-within .die-tools { opacity: 1; pointer-events: auto; }
  .die-card .die-tools button {
    padding: 1px 6px;
    font-size: 0.58em;
    border-radius: 999px;
    box-shadow: var(--shadow-sm);
  }

  .setaside-list { flex-shrink: 0; font-size: 0.75em; color: var(--ink-soft); margin-top: 2px; }
  .setaside-list ul { list-style: none; margin: 2px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 5px; }
  .setaside-list li { background: #f3ece0; border-radius: 999px; padding: 2px 10px; font-weight: 600; }

  .empty-pool { text-align: center; padding: 12px; color: var(--ink-soft); font-weight: 700; }

  h3.section-title { flex-shrink: 0; margin: 0 0 3px; font-family: 'Baloo 2', sans-serif; color: var(--brown-dark); font-size: 0.85em; }

  /* Modal */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(40,20,0,0.55);
    z-index: 50;
    align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--card);
    border-radius: 22px;
    max-width: 560px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    padding: 24px;
    position: relative;
    box-shadow: var(--shadow-lg);
  }
  .modal-box h2 { margin-top: 0; font-family: 'Baloo 2', sans-serif; color: var(--brown-dark); }
  .modal-box .close-x { position: absolute; top: 14px; right: 16px; background: #f3ece0; color: var(--ink-soft); border-radius: 50%; width: 30px; height: 30px; font-size: 1.1em; padding: 0; box-shadow: none; }
  /* Whole-die reference list (hover a die, click its ⓘ) */
  .die-ref-list { display: flex; flex-direction: column; gap: 12px; }
  .die-ref-row { display: grid; grid-template-columns: 32px 1fr; gap: 3px 10px; align-items: start; }
  .die-ref-row .glyph { font-size: 1.35em; line-height: 1.3; text-align: center; }
  .die-ref-row .name { font-weight: 800; color: var(--brown-dark); grid-column: 2; }
  .die-ref-row .meaning { font-size: 0.85em; line-height: 1.4; color: var(--ink-soft); grid-column: 2; }

  .badge { display: inline-block; background: var(--accent); color: #fff; border-radius: 999px; padding: 2px 10px; font-size: 0.68em; font-weight: 800; margin-left: 6px; }

  /* Below this width, the sidebar's fixed 500px basis plus the pool panel's
     own minimum content no longer both fit in a row — and since .wrap
     clips overflow rather than scrolling, the pool panel (i.e. every die)
     was getting squeezed toward zero width and silently clipped off-screen
     entirely on phones and portrait tablets, while the sidebar (which fits
     within its own 500px) looked fine. Stack them instead.
     Placed last in the stylesheet on purpose: these selectors match rules
     defined earlier (.panel.pool-panel, .sidebar .panel.mode-banner) at
     equal specificity, so source order is what makes the override win. */
  @media (max-width: 880px) {
    .wrap {
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
    }
    .sidebar {
      flex: 0 0 auto;
      width: 100%;
    }
    .sidebar .panel.mode-banner {
      flex: 0 0 auto;
      max-height: 60vh;
    }
    .panel.pool-panel {
      flex: 1 1 auto;
      min-height: 420px;
    }
  }

  /* On-screen diagnostics panel — see the plain <script> right before the
     module script. Off by default; tap the small bug button (bottom-right)
     to open it, or load the page with ?debug=1 to have it open itself.
     Useful for troubleshooting on a device with no dev-tools access. */
  #debugPanel {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 9999;
    max-height: 45vh;
    overflow-y: auto;
    background: #1a0f02;
    color: #ffd9a0;
    font: 12px/1.5 'Consolas', 'Menlo', monospace;
    white-space: pre-wrap;
    word-break: break-word;
    border-bottom: 3px solid #e0562f;
  }
  #debugPanel.open { display: block; }
  #debugPanelHead {
    position: sticky;
    top: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 10px;
    background: #241606;
    border-bottom: 1px solid rgba(255,217,160,0.25);
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  #debugPanelClose {
    background: none;
    border: none;
    color: #ffd9a0;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    padding: 2px 6px;
    box-shadow: none;
  }
  #debugPanelBody { padding: 8px 10px; }
  #debugPanel .dbg-line { border-bottom: 1px solid rgba(255,255,255,0.12); padding: 3px 0; }
  #debugPanel .dbg-err { color: #ff8a8a; font-weight: 700; }
  #debugPanel .dbg-info { color: #9fd6ff; }

  #debugToggle {
    position: fixed;
    bottom: 12px; right: 12px;
    z-index: 9998;
    width: 32px; height: 32px;
    border-radius: 50%;
    background: rgba(40,24,4,0.55);
    color: #ffd9a0;
    border: 1px solid rgba(255,217,160,0.35);
    font-size: 15px;
    line-height: 1;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    opacity: 0.5;
    box-shadow: none;
    transition: opacity 0.15s ease, background 0.15s ease;
  }
  #debugToggle:hover { opacity: 1; }
  #debugToggle.has-error { background: rgba(190,45,25,0.85); opacity: 0.95; }
</style>
</head>
<body>

<div id="debugPanel">
  <div id="debugPanelHead">
    <span>Diagnostics</span>
    <button id="debugPanelClose" aria-label="Close diagnostics">×</button>
  </div>
  <div id="debugPanelBody"></div>
</div>
<button id="debugToggle" aria-label="Toggle diagnostics" title="Diagnostics">🐞</button>

<header>
  <h1>Bible Quest Dice</h1>
  <p>Test build — for playtesting the design, not the final product</p>
  <a class="ref-link" href="dice-reference.html" target="_blank" rel="noopener">📖 Face &amp; Mode Reference</a>
</header>

<div class="wrap">

  <div class="sidebar">
    <div class="panel">
      <div class="controls-col">
        <span class="dice-amount-label">Choose dice amount — <span id="diceAmountValue"></span></span>
        <div class="slider-row">
          <input type="range" id="diceAmountSlider" min="3" max="12" step="1" value="12" aria-label="Number of dice, including the rule die">
        </div>
        <button id="rollBtn">🎲 Roll</button>
      </div>
    </div>

    <div class="panel mode-banner" id="modeBanner"></div>
  </div>

  <div class="panel pool-panel">
    <h3 class="section-title">The Pool <span id="poolCount" class="badge"></span></h3>
    <div class="pool-grid" id="poolGrid"></div>
    <div class="setaside-list" id="setAsideList"></div>
  </div>

</div>

<!-- Whole-die reference modal (hover a die, click its ⓘ) -->
<div class="modal-overlay" id="dieRefModal">
  <div class="modal-box">
    <button class="close-x" data-close="dieRefModal">×</button>
    <h2 id="dieRefTitle"></h2>
    <div id="dieRefList" class="die-ref-list"></div>
  </div>
</div>

<script>
// Plain (non-module) script, deliberately placed before the module script so
// it registers global error handlers first — this way it can still catch and
// display errors even if the module script itself fails to load or run at
// all (e.g. an import failing). Meant to be screenshotted on a device with
// no dev-tools access, then removed once whatever's wrong is found.
(function() {
  var panel = document.getElementById('debugPanel');
  var body = document.getElementById('debugPanelBody');
  var toggle = document.getElementById('debugToggle');
  var closeBtn = document.getElementById('debugPanelClose');
  var lines = [];

  function open() { panel.classList.add('open'); }
  function close() { panel.classList.remove('open'); }
  toggle.addEventListener('click', function() { panel.classList.toggle('open'); });
  closeBtn.addEventListener('click', close);

  // Collected in the background regardless of whether the panel is open, so
  // opening it later (or loading with ?debug=1) shows the full history —
  // it just doesn't force itself open and interrupt normal play anymore.
  function show(text, cls) {
    lines.push('<div class="dbg-line' + (cls ? ' ' + cls : '') + '">' + text.replace(/</g, '&lt;') + '</div>');
    body.innerHTML = lines.join('');
    if (cls === 'dbg-err') toggle.classList.add('has-error');
  }
  window.__dbg = show;
  window.addEventListener('error', function(e) {
    show('ERROR: ' + e.message + ' (' + (e.filename || '') + ':' + (e.lineno || '') + ')', 'dbg-err');
  });
  window.addEventListener('unhandledrejection', function(e) {
    show('UNHANDLED PROMISE REJECTION: ' + (e.reason && e.reason.message ? e.reason.message : e.reason), 'dbg-err');
  });
  var origError = console.error, origWarn = console.warn;
  console.error = function() { show('console.error: ' + Array.prototype.slice.call(arguments).join(' '), 'dbg-err'); origError.apply(console, arguments); };
  console.warn = function() { show('console.warn: ' + Array.prototype.slice.call(arguments).join(' '), 'dbg-err'); origWarn.apply(console, arguments); };
  show('Diagnostics active. UA: ' + navigator.userAgent, 'dbg-info');

  if (/[?&]debug=1\b/.test(location.search)) open();
})();
</script>

<script type="module">
import * as THREE from 'three';
window.__dbg && window.__dbg('THREE imported OK, revision ' + THREE.REVISION, 'dbg-info');
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ============================= DATA ============================= */

/* ============================= 3D DICE ENGINE ============================= */
/* Real WebGL cubes (Three.js): each die's 6 real faces are baked onto canvas
   textures and mapped onto a rounded cube. The rolled result always sits on
   the face pointed straight at the camera, so the mesh can simply spin down
   to a fixed rest orientation and still show the result flat and readable —
   no physics engine needed. */

function roundRectPath(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function wrapCanvasText(ctx, text, cx, cy, maxWidth, lineHeight) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  words.forEach(word => {
    const test = line ? line + ' ' + word : word;
    if (ctx.measureText(test).width > maxWidth && line) {
      lines.push(line);
      line = word;
    } else {
      line = test;
    }
  });
  if (line) lines.push(line);
  const startY = cy - (lines.length - 1) * lineHeight / 2;
  lines.forEach((l, i) => ctx.fillText(l, cx, startY + i * lineHeight));
}

// Mode-die icons are hand-drawn vector figures rather than font glyphs or
// abstract marks — each of the six rules is embodied by a person whose
// posture fits its goal (a bent gleaner, a seated disciple, a staff-bearing
// elder, a figure examining its own reflection, a child reaching up to
// ask, a veiled figure with part of itself concealed). Drawing them
// guarantees a crisp result instead of depending on a font's coverage of
// obscure Unicode symbols.
function drawPersonBody(ctx, cx, cy, r, opts) {
  opts = opts || {};
  const headR = r * (opts.headScale || 0.22);
  const headCy = cy - r * (opts.headY !== undefined ? opts.headY : 0.55);
  const shoulderY = headCy + headR * 1.15;
  const topW = r * (opts.topW || 0.26);
  const botW = r * (opts.botW || 0.5);
  const botY = cy + r * (opts.botY !== undefined ? opts.botY : 0.58);
  ctx.beginPath();
  ctx.moveTo(cx - topW, shoulderY);
  ctx.lineTo(cx + topW, shoulderY);
  ctx.lineTo(cx + botW, botY);
  ctx.lineTo(cx - botW, botY);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx, headCy, headR, 0, Math.PI * 2);
  ctx.fill();
  return { headR, headCy, shoulderY, topW, botW, botY };
}

function drawModeIcon(ctx, mode, cx, cy, r) {
  ctx.save();
  ctx.strokeStyle = '#eecb7a';
  ctx.fillStyle = '#eecb7a';
  ctx.lineWidth = 9;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  if (mode === 'Verse Finder') {
    // A bent figure, gathering low to the ground — a sheaf already at hand.
    ctx.beginPath();
    ctx.moveTo(cx - r * 0.15, cy + r * 0.55);
    ctx.quadraticCurveTo(cx - r * 0.5, cy + r * 0.15, cx - r * 0.28, cy - r * 0.25);
    ctx.quadraticCurveTo(cx - r * 0.05, cy - r * 0.55, cx + r * 0.35, cy - r * 0.35);
    ctx.quadraticCurveTo(cx + r * 0.55, cy - r * 0.1, cx + r * 0.32, cy + r * 0.2);
    ctx.quadraticCurveTo(cx + r * 0.1, cy + r * 0.5, cx - r * 0.15, cy + r * 0.55);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx + r * 0.4, cy - r * 0.42, r * 0.17, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx - r * 0.55, cy + r * 0.55, r * 0.16, r * 0.09, -0.4, 0, Math.PI * 2);
    ctx.fill();
  } else if (mode === 'FOCUS') {
    // A seated, still figure — depth over breadth, nothing extra added.
    drawPersonBody(ctx, cx, cy, r, { headY: 0.5, botY: 0.5, topW: 0.22, botW: 0.62 });
  } else if (mode === 'Story Builder') {
    // An elder: upright, bearded, leaning on a staff.
    const p = drawPersonBody(ctx, cx, cy, r, { botY: 0.58 });
    ctx.beginPath();
    ctx.moveTo(cx - p.headR * 0.5, p.headCy + p.headR * 0.6);
    ctx.lineTo(cx, p.headCy + p.headR * 1.6);
    ctx.lineTo(cx + p.headR * 0.5, p.headCy + p.headR * 0.6);
    ctx.closePath();
    ctx.fill();
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(cx + p.botW * 0.75, p.shoulderY - p.headR * 0.2);
    ctx.lineTo(cx + p.botW * 0.9, p.botY + r * 0.1);
    ctx.stroke();
  } else if (mode === 'EXILE') {
    // A figure examining itself, mirrored fainter below a still waterline.
    const lineY = cy + r * 0.15;
    ctx.globalAlpha = 0.55;
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(cx - r * 0.9, lineY);
    ctx.lineTo(cx + r * 0.9, lineY);
    ctx.stroke();
    ctx.globalAlpha = 1;
    const figCy = cy - r * 0.15;
    const figOpts = { headY: 0.6, botY: 0.3, topW: 0.24, botW: 0.46 };
    drawPersonBody(ctx, cx, figCy, r * 0.85, figOpts);
    ctx.save();
    ctx.globalAlpha = 0.32;
    ctx.translate(0, 2 * lineY);
    ctx.scale(1, -1);
    drawPersonBody(ctx, cx, figCy, r * 0.85, figOpts);
    ctx.restore();
  } else if (mode === 'QUESTION') {
    // A child, smaller and reaching up to ask.
    const p = drawPersonBody(ctx, cx, cy, r, { headScale: 0.28, headY: 0.3, botY: 0.55, topW: 0.16, botW: 0.34 });
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.moveTo(cx + p.topW * 0.9, p.shoulderY);
    ctx.quadraticCurveTo(cx + r * 0.5, p.headCy + p.headR * 0.6, cx + r * 0.55, p.headCy - r * 0.15);
    ctx.stroke();
  } else if (mode === 'RIDDLE') {
    // A veiled figure, part of it concealed — mystery to be searched out.
    drawPersonBody(ctx, cx, cy, r, { botY: 0.55 });
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.ellipse(cx + r * 0.32, cy - r * 0.15, r * 0.55, r * 0.75, Math.PI / 6, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

// Shared by both the 3D cube (baked onto a CanvasTexture) and the flat 2D
// fallback (shown directly as an <img>-like canvas) — see WEBGL_OK below.
function makeFaceCanvas(glyph, label, purple) {
  const size = 256;
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createLinearGradient(0, 0, size, size);
  if (purple) { grad.addColorStop(0, '#1c1c1c'); grad.addColorStop(1, '#333333'); }
  else { grad.addColorStop(0, '#ffffff'); grad.addColorStop(1, '#f5f5f5'); }
  ctx.fillStyle = grad;
  roundRectPath(ctx, 6, 6, size - 12, size - 12, 30);
  ctx.fill();
  ctx.lineWidth = 5;
  ctx.strokeStyle = purple ? 'rgba(224,165,39,0.4)' : 'rgba(120,120,120,0.18)';
  roundRectPath(ctx, 6, 6, size - 12, size - 12, 30);
  ctx.stroke();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  if (purple && MODE_EMOJI[label]) {
    ctx.font = '92px "Segoe UI Emoji","Noto Color Emoji",sans-serif';
    ctx.fillText(MODE_EMOJI[label], size / 2, size * 0.4);
  } else if (purple) {
    drawModeIcon(ctx, label, size / 2, size * 0.38, 62);
  } else {
    ctx.font = '92px "Segoe UI Emoji","Noto Color Emoji",sans-serif';
    ctx.fillText(glyph, size / 2, size * 0.4);
  }
  ctx.font = "700 25px 'Nunito', sans-serif";
  ctx.fillStyle = purple ? '#ffffff' : '#3a2c1a';
  wrapCanvasText(ctx, label, size / 2, size * 0.75, size - 44, 28);
  return canvas;
}

function makeFaceTexture(glyph, label, purple) {
  const tex = new THREE.CanvasTexture(makeFaceCanvas(glyph, label, purple));
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.needsUpdate = true;
  return tex;
}

function buildDieMesh(faces, frontFace, getGlyph, purple) {
  const others = faces.filter(f => f !== frontFace);
  const slots = new Array(6);
  slots[4] = frontFace; // +z = the face pointed at the camera = the rolled result
  const order = [0, 1, 2, 3, 5];
  order.forEach((slot, i) => { slots[slot] = others[i] !== undefined ? others[i] : frontFace; });
  // MeshBasicMaterial: no lighting model at all, just the texture — the
  // simplest shader Three.js can generate. PBR materials (the earlier
  // MeshPhysicalMaterial+clearcoat, then MeshStandardMaterial) were both
  // found to crash shader compilation on at least one real mobile GPU
  // driver (see createSharedDiceRenderer's comment). The face art already has its own
  // baked-in gradient/shading drawn into the canvas texture, so this still
  // reads as a lit, dimensional die — just without responsive lighting.
  const materials = slots.map(f => new THREE.MeshBasicMaterial({
    map: makeFaceTexture(getGlyph(f), f, purple)
  }));
  const geo = new RoundedBoxGeometry(1.5, 1.5, 1.5, 4, 0.2);
  return new THREE.Mesh(geo, materials);
}

function newAnim() {
  const sign = () => (Math.random() < 0.5 ? 1 : -1);
  // Each axis must land on a *whole* number of full turns (2π × integer) so
  // that at t=1 the cube's rotation matrix is back to identity — the result
  // face ends up dead flat and square to the camera, never resting at a
  // tilt where the winning side is hard to read.
  const turns = () => (2 + Math.floor(Math.random() * 3)) * Math.PI * 2 * sign();
  return {
    start: performance.now(),
    duration: 850 + Math.random() * 300,
    rx: turns(),
    ry: turns(),
    rz: turns(),
    hop: 0.1 + Math.random() * 0.08
  };
}
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

// This app used to give every die its own WebGLRenderer (and thus its own
// WebGL context) — up to 13 at once at max dice count. Mobile Chrome caps
// how many *simultaneous* WebGL contexts a page may hold; once exceeded, it
// silently evicts the OLDEST contexts to make room for new ones. An evicted
// (lost) context then fails to compile shaders, and on top of that, some
// mobile GPU drivers report that failure in a log format Three.js's own
// error-log parser doesn't expect, crashing with a null-dereference (a
// known class of Three.js bug: "Cannot read properties of null (reading
// 'trim')" inside WebGLProgram's diagnostics) instead of a normal error.
// That exactly matches what was observed: the FIRST few dice created (the
// oldest contexts, evicted first) failing while later ones rendered fine.
//
// The real fix is to only ever need ONE WebGL context, period — every die
// shares this single renderer, drawn into its own on-screen rectangle each
// frame via setScissor/setViewport (see tickAllDice) rather than each
// owning a separate context. Shaders still compile lazily on first render
// rather than at construction, so this smoke-tests that too by rendering
// one real throwaway die, inside this try/catch, before treating WebGL as
// usable — if THIS render doesn't crash, none of the real per-die renders
// sharing the same context/session should either.
function createSharedDiceRenderer() {
  let renderer;
  try {
    const canvas = document.createElement('canvas');
    canvas.id = 'sharedDiceCanvas';
    renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, failIfMajorPerformanceCaveat: false });
    if (!renderer.getContext()) return null;
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(48, 1, 0.1, 10);
    camera.position.z = 3;
    const geo = new RoundedBoxGeometry(1.5, 1.5, 1.5, 4, 0.2);
    const mat = new THREE.MeshBasicMaterial({ map: makeFaceTexture('🎲', 'test', false) });
    const mesh = new THREE.Mesh(geo, mat);
    scene.add(mesh);
    renderer.setSize(64, 64, false);
    renderer.setViewport(0, 0, 64, 64);
    renderer.render(scene, camera); // shaders compile lazily right here
    geo.dispose();
    mat.map.dispose();
    mat.dispose();
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.setClearColor(0x000000, 0);
    renderer.setScissorTest(true);
    return renderer;
  } catch (e) {
    console.warn('WebGL unusable on this device — using flat 2D die faces instead of 3D cubes:', e);
    if (renderer) {
      renderer.dispose();
      if (renderer.forceContextLoss) renderer.forceContextLoss();
    }
    return null;
  }
}
const sharedRenderer = createSharedDiceRenderer();
const WEBGL_OK = !!sharedRenderer;
window.__dbg && window.__dbg('WEBGL_OK = ' + WEBGL_OK, 'dbg-info');
if (sharedRenderer) {
  document.body.appendChild(sharedRenderer.domElement);
  const resizeSharedRenderer = () => sharedRenderer.setSize(window.innerWidth, window.innerHeight, false);
  resizeSharedRenderer();
  window.addEventListener('resize', resizeSharedRenderer);
}

function create2DDieFace(container, face, getGlyph, purple) {
  const canvas = makeFaceCanvas(getGlyph(face), face, purple);
  canvas.className = 'face-2d';
  container.appendChild(canvas);
  return { container, canvas, is2D: true, selected: false };
}

function update2DDieFace(inst, face, getGlyph, purple) {
  const canvas = makeFaceCanvas(getGlyph(face), face, purple);
  canvas.className = 'face-2d';
  inst.container.replaceChild(canvas, inst.canvas);
  inst.canvas = canvas;
}

// The camera's tumble-safe framing, and how much closer the camera moves in
// when the player selects a die. Zooming in during the tumble itself would
// clip the cube against this same tight frustum, so the zoom only ever
// applies after rotation has settled flat (see tickAllDice) — the resting
// silhouette is far smaller than the mid-tumble bounding sphere, leaving
// plenty of room to move in safely.
//
// Note: the <=4 dice 2x2 layout (.grid-corners) intentionally has NO
// matching camera zoom — that was tried and reverted (it produced a
// distracting automatic enlarge-on-landing that wasn't wanted). Those dice
// still render bigger than in denser layouts purely because their grid
// cell is bigger, with no extra camera effect layered on top.
const BASE_CAM = { x: 0, y: 0.85, z: 3.55 };
const ZOOM_FACTOR = 0.72; // ~1.39x bigger, on selection only
const SELECT_ZOOM_MS = 260;

function createDieScene(container, faces, frontFace, getGlyph, purple) {
  const scene = new THREE.Scene();
  // FOV/distance are tuned as tight as possible around the die's full
  // tumbling+hopping reach (bounding-sphere corner ~1.3 units, plus the
  // small hop) so the cube fills as much of its cell as it can without
  // clipping mid-roll or at rest. Aspect is a placeholder — tickAllDice
  // recomputes it every frame from container's actual on-screen rect,
  // since there's no longer a per-die canvas to size once at creation.
  const camera = new THREE.PerspectiveCamera(48, 1, 0.1, 10);
  camera.position.set(BASE_CAM.x, BASE_CAM.y, BASE_CAM.z);
  camera.lookAt(0, 0, 0);
  // No lights: the die material is MeshBasicMaterial (unlit), so scene
  // lights would just be inert overhead.

  const mesh = buildDieMesh(faces, frontFace, getGlyph, purple);
  scene.add(mesh);

  const shadowCanvas = document.createElement('canvas');
  shadowCanvas.width = 128; shadowCanvas.height = 128;
  const sctx = shadowCanvas.getContext('2d');
  const rg = sctx.createRadialGradient(64, 64, 6, 64, 64, 64);
  rg.addColorStop(0, 'rgba(40,20,0,0.35)');
  rg.addColorStop(1, 'rgba(40,20,0,0)');
  sctx.fillStyle = rg;
  sctx.fillRect(0, 0, 128, 128);
  const shadowMesh = new THREE.Mesh(
    new THREE.PlaneGeometry(2.1, 2.1),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(shadowCanvas), transparent: true, depthWrite: false })
  );
  shadowMesh.rotation.x = -Math.PI / 2;
  shadowMesh.position.y = -0.77;
  scene.add(shadowMesh);

  return { container, scene, camera, mesh, anim: newAnim(), selected: false };
}

function disposeMeshDeep(mesh) {
  if (!mesh) return;
  mesh.geometry.dispose();
  const mats = Array.isArray(mesh.material) ? mesh.material : [mesh.material];
  mats.forEach(m => { if (m.map) m.map.dispose(); m.dispose(); });
}

function retriggerDie(inst, faces, frontFace, getGlyph, purple) {
  inst.scene.remove(inst.mesh);
  disposeMeshDeep(inst.mesh);
  const mesh = buildDieMesh(faces, frontFace, getGlyph, purple);
  inst.scene.add(mesh);
  inst.mesh = mesh;
  inst.anim = newAnim();
}

function disposeDie3D(inst) {
  disposeMeshDeep(inst.mesh);
  inst.scene.traverse(obj => {
    if (obj.isMesh && obj !== inst.mesh) {
      obj.geometry.dispose();
      if (obj.material.map) obj.material.map.dispose();
      obj.material.dispose();
    }
  });
  // No per-instance renderer/canvas to dispose anymore — every die shares
  // sharedRenderer/sharedRenderer.domElement, which persists for the whole
  // session (see createSharedDiceRenderer).
}

const diceInstances = new Map();

function tickAllDice(now) {
  if (sharedRenderer) {
    // Full clear (scissor off) first, since leftover pixels from a die that
    // moved (scroll) or left the pool would otherwise persist outside
    // wherever this frame's per-die scissor rects land.
    sharedRenderer.setScissorTest(false);
    sharedRenderer.clear();
    sharedRenderer.setScissorTest(true);
  }
  diceInstances.forEach(inst => {
    if (inst.is2D) return; // flat fallback faces have no camera/mesh to animate
    const a = inst.anim;
    const t = Math.min(1, (now - a.start) / a.duration);
    const e = easeOutCubic(t);
    inst.mesh.rotation.set(a.rx * e, a.ry * e, a.rz * e);
    inst.mesh.position.y = t < 1 ? Math.sin(Math.PI * t) * a.hop : 0;

    if (t < 1) {
      // Still tumbling: hold the proven-safe wide framing, and reset both
      // the zoom target *and* current value to match (1 = wide) — not just
      // the target — so a die that re-tumbles while already zoomed in from
      // selection doesn't ease "from" a stale value back to that same
      // value (a same-value no-op that snaps instead of easing).
      inst.selZoomTarget = undefined;
      inst.selZoomCurrent = 1;
      inst.camera.position.set(BASE_CAM.x, BASE_CAM.y, BASE_CAM.z);
    } else {
      // Flat and frozen — safe to zoom. Only selection drives this now.
      const selTarget = inst.selected ? ZOOM_FACTOR : 1;
      if (inst.selZoomTarget !== selTarget) {
        inst.selZoomFrom = inst.selZoomCurrent !== undefined ? inst.selZoomCurrent : 1;
        inst.selZoomTarget = selTarget;
        inst.selZoomStart = now;
      }
      const zt = Math.min(1, (now - inst.selZoomStart) / SELECT_ZOOM_MS);
      const ze = easeOutCubic(zt);
      const selCurrent = inst.selZoomFrom + (inst.selZoomTarget - inst.selZoomFrom) * ze;
      inst.selZoomCurrent = selCurrent;

      inst.camera.position.set(BASE_CAM.x * selCurrent, BASE_CAM.y * selCurrent, BASE_CAM.z * selCurrent);
    }

    // Draw this die into its own on-screen rectangle within the ONE shared
    // canvas, recomputed fresh every frame (so scrolling/resizing/layout
    // changes are always reflected with zero extra bookkeeping). Three's
    // setViewport/setScissor use bottom-left-origin CSS-pixel coordinates,
    // while getBoundingClientRect is top-left-origin, hence the Y flip.
    const rect = inst.container.getBoundingClientRect();
    const w = rect.width, h = rect.height;
    if (w <= 0 || h <= 0) return; // not laid out / off-screen this frame
    const x = rect.left;
    const y = window.innerHeight - rect.bottom;
    inst.camera.aspect = w / h;
    inst.camera.updateProjectionMatrix();
    sharedRenderer.setViewport(x, y, w, h);
    sharedRenderer.setScissor(x, y, w, h);
    sharedRenderer.render(inst.scene, inst.camera);
  });
  requestAnimationFrame(tickAllDice);
}
requestAnimationFrame(tickAllDice);

/* ============================= STATE ============================= */

let uidCounter = 1;
let state = {
  diceCount: 11,
  pool: [],
  setAside: [],
  mode: "Verse Finder",
  ruleDie: null
};

/* ============================= HELPERS ============================= */

function pick(arr) { return arr[Math.floor(Math.random()*arr.length)]; }
function newUid() { return uidCounter++; }

let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playDiceSound(clacks) {
  let ctx;
  try { ctx = getAudioCtx(); } catch(e) { return; }
  const now = ctx.currentTime;
  const n = clacks || (4 + Math.floor(Math.random()*3));
  for (let i=0; i<n; i++) {
    const t = now + i * (0.055 + Math.random()*0.05);
    const bufferSize = Math.floor(ctx.sampleRate * 0.035);
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let j=0; j<bufferSize; j++) {
      data[j] = (Math.random()*2-1) * Math.pow(1 - j/bufferSize, 2);
    }
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 700 + Math.random()*1500;
    filter.Q.value = 1.1;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.55, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.045);
    noise.connect(filter).connect(gain).connect(ctx.destination);
    noise.start(t);
    noise.stop(t + 0.05);
  }
}

function playSelectTone(rank) {
  let ctx;
  try { ctx = getAudioCtx(); } catch(e) { return; }
  const now = ctx.currentTime;
  // Pitch climbs a bit with each die selected in the current turn (rank =
  // how many dice are now selected), so claiming a bigger set of dice
  // sounds like it's building toward something.
  const freq = 520 * Math.pow(2, Math.min(rank - 1, 10) / 12);
  const osc = ctx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(freq, now);
  const osc2 = ctx.createOscillator();
  osc2.type = 'sine';
  osc2.frequency.setValueAtTime(freq * 2, now);
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(0.3, now + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.17);
  osc.connect(gain);
  osc2.connect(gain);
  gain.connect(ctx.destination);
  osc.start(now); osc.stop(now + 0.18);
  osc2.start(now); osc2.stop(now + 0.18);
}

function shuffled(arr) {
  const copy = arr.slice();
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function rollPool() {
  // Locked dice ride through a fresh roll untouched — their die category is
  // also excluded from the draw so the same die never appears twice.
  const locked = state.pool.filter(d => d.locked).map(d => ({...d, sel:false}));
  const lockedNames = new Set(locked.map(d => d.dieName));
  const n = Math.max(0, state.diceCount - locked.length);
  const chosenDice = shuffled(CORE_DICE.filter(d => !lockedNames.has(d.name))).slice(0, n);
  const rolled = chosenDice.map(d => ({uid:newUid(), dieName:d.name, face:pick(d.faces), faces:d.faces, sel:false, locked:false}));
  state.pool = [...locked, ...rolled];
  state.setAside = [];
  const modeLocked = !!(state.ruleDie && state.ruleDie.locked);
  if (!modeLocked) state.mode = pick(MODE_DIE_FACES);
  state.ruleDie = {face: state.mode, locked: modeLocked};
}

function toggleLock(uid) {
  const d = state.pool.find(x => x.uid === uid);
  if (!d) return;
  d.locked = !d.locked;
  render();
}

function toggleRuleLock() {
  if (!state.ruleDie) return;
  state.ruleDie.locked = !state.ruleDie.locked;
  render();
}

function rerollMode() {
  let newMode = pick(MODE_DIE_FACES);
  while (newMode === state.mode && MODE_DIE_FACES.length > 1) newMode = pick(MODE_DIE_FACES);
  state.mode = newMode;
  state.ruleDie.face = newMode;
  playDiceSound(2);
  state.pool.forEach(d => d.sel = false);
  render();
}

function toggleSelect(uid) {
  const d = state.pool.find(x => x.uid === uid);
  if (!d) return;
  const singleModes = ["FOCUS"];
  if (singleModes.includes(state.mode)) {
    const wasSelected = d.sel;
    state.pool.forEach(x => x.sel = false);
    d.sel = !wasSelected;
  } else {
    d.sel = !d.sel;
  }
  if (d.sel) {
    const rank = state.pool.filter(x => x.sel).length;
    playSelectTone(rank);
  }
  render();
}

function rerollFace(uid) {
  const d = state.pool.find(x => x.uid === uid);
  if (!d) return;
  const others = d.faces.filter(f => f !== d.face);
  d.face = others.length ? pick(others) : d.face;
  d.sel = false;
  playDiceSound(2);
  const inst = diceInstances.get(uid);
  if (inst) {
    if (inst.is2D) update2DDieFace(inst, d.face, f => EMOJI_MAP[f] || '', false);
    else retriggerDie(inst, d.faces, d.face, f => EMOJI_MAP[f] || '', false);
  }
  render();
}

// Press-and-hold gesture shared by every die card: a quick tap fires onTap
// (select, in the pool grid), holding past HOLD_MS fires onHold (reroll)
// instead and swallows the tap so a single gesture never does both.
const HOLD_MS = 550;
function attachHoldReroll(wrapper, onTap, onHold) {
  let timer = null;
  let held = false;
  function cancel() {
    if (timer) { clearTimeout(timer); timer = null; }
    wrapper.classList.remove('holding');
  }
  wrapper.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button') || (e.button !== undefined && e.button !== 0)) return;
    held = false;
    wrapper.classList.add('holding');
    timer = setTimeout(() => {
      held = true;
      wrapper.classList.remove('holding');
      onHold();
    }, HOLD_MS);
  });
  wrapper.addEventListener('pointerup', (e) => {
    if (e.target.closest('button')) return;
    cancel();
    if (!held && onTap) onTap();
    held = false;
  });
  wrapper.addEventListener('pointerleave', cancel);
  wrapper.addEventListener('pointercancel', cancel);
}

function setAsideDie(uid) {
  const idx = state.pool.findIndex(x => x.uid === uid);
  if (idx === -1) return;
  const d = state.pool[idx];
  const reason = window.prompt('Why does "' + d.face + '" not belong in this story? (naming this still counts as a contribution)', '');
  if (reason === null) return;
  state.pool.splice(idx, 1);
  state.setAside.push({face:d.face, reason: reason || "(no reason given)"});
  render();
}

// Hover a die and click its ⓘ to see all six of its faces at once, not just
// the one currently rolled — a quick lookup without leaving the table.
function openDieReference(title, faceNames, getGlyph, getMeaning) {
  document.getElementById('dieRefTitle').textContent = title;
  document.getElementById('dieRefList').innerHTML = faceNames.map(f =>
    '<div class="die-ref-row"><span class="glyph">' + getGlyph(f) + '</span>' +
    '<span class="name">' + f + '</span>' +
    '<span class="meaning">' + (getMeaning(f) || '') + '</span></div>'
  ).join('');
  document.getElementById('dieRefModal').classList.add('open');
}

/* ============================= RENDER ============================= */

function render() {
  renderControls();
  renderModeBanner();
  renderPool();
}

function renderControls() {
  const slider = document.getElementById('diceAmountSlider');
  const total = state.diceCount + 1; // +1 for the black rule die, always rolled
  slider.value = total;
  document.getElementById('diceAmountValue').textContent = total + ' dice';
  slider.oninput = () => {
    const newTotal = parseInt(slider.value, 10);
    state.diceCount = newTotal - 1;
    document.getElementById('diceAmountValue').textContent = newTotal + ' dice';
  };
}

function renderModeBanner() {
  const info = MODE_INFO[state.mode];
  const st = MODE_STYLE[state.mode];
  const img = MODE_IMAGE[state.mode];
  const el = document.getElementById('modeBanner');
  el.style.background = 'linear-gradient(155deg, ' + st.color + ', ' + st.color + 'cc)';
  el.innerHTML =
    '<div class="mode-image"><img src="' + img.url + '" alt="' + img.credit.replace(/"/g, '&quot;') + '" loading="lazy" onerror="this.closest(\'.mode-image\').style.display=\'none\'"></div>' +
    '<div class="image-ref">' + img.ref + '</div>' +
    '<div class="image-credit">' + img.credit + '</div>' +
    '<div class="mode-head"><span class="mode-glyph">' + st.glyph + '</span>' +
    '<div><h2>' + state.mode + '</h2> <span class="goal">— ' + info.goal + '</span></div></div>' +
    '<p class="mode-steps">' + info.steps.join(' &nbsp;→&nbsp; ') + '</p>' +
    '<div class="mode-actions"><button class="secondary small" id="rerollModeBtn">🔁 Reroll Mode</button>' +
    '<span class="hint-text">the table may override the rolled mode by agreement</span></div>';
  document.getElementById('rerollModeBtn').onclick = rerollMode;
}

function renderPool() {
  const grid = document.getElementById('poolGrid');
  document.getElementById('poolCount').textContent = state.pool.length + ' standing';
  // Rule die + symbol dice together; at 4 or fewer, corner them into a 2x2
  // grid instead of one stretched row (see .grid-corners for why). Sidebar
  // width stays fixed regardless of dice count, so the pool panel is always
  // the same size — only the grid inside it changes shape.
  const totalDiceShown = state.pool.length + (state.ruleDie ? 1 : 0);
  const isCompact = totalDiceShown > 0 && totalDiceShown <= 4;
  grid.classList.toggle('grid-corners', isCompact);

  let emptyMsg = document.getElementById('emptyPoolMsg');
  if (state.pool.length === 0) {
    if (!emptyMsg) {
      emptyMsg = document.createElement('div');
      emptyMsg.id = 'emptyPoolMsg';
      emptyMsg.className = 'empty-pool';
      emptyMsg.style.gridColumn = '1/-1';
      emptyMsg.textContent = 'No dice standing. Roll to begin a new pool.';
      grid.appendChild(emptyMsg);
    }
  } else if (emptyMsg) {
    emptyMsg.remove();
  }

  // Rule die: one persistent 3D instance; only re-tumbles when its face changes.
  if (state.ruleDie) {
    const getGlyph = f => MODE_STYLE[f].glyph;
    let inst = diceInstances.get('rule-die');
    if (!inst) {
      const wrapper = document.createElement('div');
      wrapper.className = 'die-card rule-die';
      const slot = document.createElement('div');
      slot.className = 'cube-slot';
      wrapper.appendChild(slot);
      const cat = document.createElement('span');
      cat.className = 'die-cat';
      cat.textContent = 'Rule Die';
      wrapper.appendChild(cat);
      const ruleTools = document.createElement('div');
      ruleTools.className = 'die-tools';
      const ruleInfoBtn = document.createElement('button');
      ruleInfoBtn.className = 'secondary small';
      ruleInfoBtn.textContent = 'ⓘ';
      ruleInfoBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        openDieReference('Rule Die', MODE_DIE_FACES, f => MODE_EMOJI[f] || '', f => MODE_INFO[f] && MODE_INFO[f].goal);
      });
      const ruleLockBtn = document.createElement('button');
      ruleLockBtn.className = 'secondary small';
      ruleLockBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleRuleLock(); });
      ruleTools.appendChild(ruleInfoBtn);
      ruleTools.appendChild(ruleLockBtn);
      wrapper.appendChild(ruleTools);
      grid.insertBefore(wrapper, grid.firstChild);
      attachHoldReroll(wrapper, null, rerollMode);
      wrapper.addEventListener('dblclick', (e) => {
        if (e.target.closest('button')) return;
        toggleRuleLock();
      });
      inst = WEBGL_OK
        ? createDieScene(slot, MODE_DIE_FACES, state.ruleDie.face, getGlyph, true)
        : create2DDieFace(slot, state.ruleDie.face, getGlyph, true);
      inst.wrapper = wrapper;
      inst.currentFace = state.ruleDie.face;
      inst.lockBtn = ruleLockBtn;
      diceInstances.set('rule-die', inst);
    } else if (inst.currentFace !== state.ruleDie.face) {
      if (inst.is2D) update2DDieFace(inst, state.ruleDie.face, getGlyph, true);
      else retriggerDie(inst, MODE_DIE_FACES, state.ruleDie.face, getGlyph, true);
      inst.currentFace = state.ruleDie.face;
    }
    inst.wrapper.classList.toggle('locked', !!state.ruleDie.locked);
    inst.lockBtn.textContent = state.ruleDie.locked ? '🔓' : '🔒';
    inst.lockBtn.title = state.ruleDie.locked ? 'Unlock the mode' : 'Lock the mode so Roll leaves it alone';
  }

  // Symbol dice: 3D instances are created once per uid and left alone until
  // that uid leaves the pool (set aside, or a fresh roll replaces everything).
  const desiredUids = new Set(state.pool.map(d => d.uid));
  Array.from(diceInstances.keys()).forEach(key => {
    if (key === 'rule-die' || desiredUids.has(key)) return;
    const inst = diceInstances.get(key);
    if (!inst.is2D) disposeDie3D(inst);
    inst.wrapper.remove();
    diceInstances.delete(key);
  });

  state.pool.forEach(d => {
    let inst = diceInstances.get(d.uid);
    if (!inst) {
      const wrapper = document.createElement('div');
      wrapper.className = 'die-card';
      const slot = document.createElement('div');
      slot.className = 'cube-slot';
      wrapper.appendChild(slot);
      const cat = document.createElement('span');
      cat.className = 'die-cat';
      cat.textContent = d.dieName;
      wrapper.appendChild(cat);
      const tools = document.createElement('div');
      tools.className = 'die-tools';
      const infoBtn = document.createElement('button');
      infoBtn.className = 'secondary small';
      infoBtn.textContent = 'ⓘ';
      infoBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        openDieReference(d.dieName, d.faces, f => EMOJI_MAP[f] || '', f => FACE_REF[f] && FACE_REF[f].meaning);
      });
      const asideBtn = document.createElement('button');
      asideBtn.className = 'secondary small';
      asideBtn.textContent = 'aside';
      asideBtn.addEventListener('click', (e) => { e.stopPropagation(); setAsideDie(d.uid); });
      const lockBtn = document.createElement('button');
      lockBtn.className = 'secondary small';
      lockBtn.title = 'Lock this die so Roll leaves it alone';
      lockBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleLock(d.uid); });
      tools.appendChild(infoBtn);
      tools.appendChild(lockBtn);
      tools.appendChild(asideBtn);
      wrapper.appendChild(tools);
      attachHoldReroll(wrapper, () => toggleSelect(d.uid), () => rerollFace(d.uid));
      wrapper.addEventListener('dblclick', (e) => {
        if (e.target.closest('button')) return;
        toggleLock(d.uid);
      });
      grid.appendChild(wrapper);
      const getGlyph = f => EMOJI_MAP[f] || '';
      inst = WEBGL_OK
        ? createDieScene(slot, d.faces, d.face, getGlyph, false)
        : create2DDieFace(slot, d.face, getGlyph, false);
      inst.wrapper = wrapper;
      inst.lockBtn = lockBtn;
      diceInstances.set(d.uid, inst);
    }
    inst.selected = !!d.sel;
    inst.wrapper.classList.toggle('selected', !!d.sel);
    inst.wrapper.classList.toggle('locked', !!d.locked);
    inst.lockBtn.textContent = d.locked ? '🔓' : '🔒';
    inst.lockBtn.title = d.locked ? 'Unlock this die' : 'Lock this die so Roll leaves it alone';
  });

  const asideEl = document.getElementById('setAsideList');
  if (state.setAside.length === 0) {
    asideEl.innerHTML = '';
  } else {
    asideEl.innerHTML = '<strong>Set aside this roll:</strong><ul>' +
      state.setAside.map(a => '<li><em>' + a.face + '</em> — ' + a.reason + '</li>').join('') +
      '</ul>';
  }

  // No explicit re-sync call needed here anymore: each die's camera aspect
  // and on-screen viewport/scissor rect are recomputed fresh every single
  // animation frame in tickAllDice, straight from getBoundingClientRect(),
  // so newly-appended cards are correctly sized on the very next frame
  // regardless of exactly when the grid's layout settles.
}

/* ============================= EVENTS ============================= */

document.getElementById('rollBtn').addEventListener('click', () => { playDiceSound(); rollPool(); render(); });
document.querySelectorAll('[data-close]').forEach(btn => {
  btn.addEventListener('click', () => document.getElementById(btn.dataset.close).classList.remove('open'));
});
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.classList.remove('open'); });
});

/* ============================= INIT ============================= */

try {
  rollPool();
  render();
  const fallback2DCount = document.querySelectorAll('.cube-slot canvas.face-2d').length;
  const gridRect = document.getElementById('poolGrid').getBoundingClientRect();
  window.__dbg && window.__dbg(
    'Init OK. diceInstances=' + diceInstances.size +
    ', sharedRenderer=' + (sharedRenderer ? 'yes' : 'no') +
    ', 2D-fallback faces=' + fallback2DCount +
    ', poolGrid size=' + Math.round(gridRect.width) + 'x' + Math.round(gridRect.height) +
    ', wrap size=' + Math.round(document.querySelector('.wrap').getBoundingClientRect().width) + 'x' + Math.round(document.querySelector('.wrap').getBoundingClientRect().height),
    'dbg-info'
  );
} catch (e) {
  window.__dbg && window.__dbg('INIT THREW: ' + e.message + '\n' + (e.stack || ''), 'dbg-err');
  throw e;
}
</script>
</body>
</html>
